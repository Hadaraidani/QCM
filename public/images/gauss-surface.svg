<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Fond -->
  <rect width="400" height="300" fill="#1e293b"/>
  
  <!-- Titre -->
  <text x="200" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Théorème de Gauss - Surface fermée</text>
  
  <!-- Surface de Gauss (ellipse pointillée) -->
  <ellipse cx="200" cy="160" rx="120" ry="80" fill="none" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="330" y="160" fill="#60a5fa" font-size="12" font-family="Arial, sans-serif">Surface S</text>
  
  <!-- Charge positive au centre -->
  <circle cx="200" cy="160" r="20" fill="#ef4444"/>
  <text x="200" y="165" text-anchor="middle" fill="white" font-size="16" font-family="Arial, sans-serif" font-weight="bold">+Q</text>
  
  <!-- Flèches de champ E (radiales) -->
  <!-- Droite -->
  <line x1="220" y1="160" x2="280" y2="160" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="280,160 270,155 270,165" fill="#fbbf24"/>
  <text x="260" y="145" fill="#fbbf24" font-size="11" font-family="Arial, sans-serif">E⃗</text>
  
  <!-- Haut -->
  <line x1="200" y1="140" x2="200" y2="90" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="200,90 195,100 205,100" fill="#fbbf24"/>
  <text x="210" y="95" fill="#fbbf24" font-size="11" font-family="Arial, sans-serif">E⃗</text>
  
  <!-- Gauche -->
  <line x1="180" y1="160" x2="120" y2="160" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="120,160 130,155 130,165" fill="#fbbf24"/>
  <text x="130" y="145" fill="#fbbf24" font-size="11" font-family="Arial, sans-serif">E⃗</text>
  
  <!-- Bas -->
  <line x1="200" y1="180" x2="200" y2="230" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="200,230 195,220 205,220" fill="#fbbf24"/>
  <text x="210" y="225" fill="#fbbf24" font-size="11" font-family="Arial, sans-serif">E⃗</text>
  
  <!-- Diagonales -->
  <line x1="215" y1="145" x2="255" y2="105" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="255,105 245,108 248,118" fill="#fbbf24"/>
  
  <line x1="185" y1="175" x2="145" y2="215" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="145,215 155,212 152,202" fill="#fbbf24"/>
  
  <line x1="215" y1="175" x2="255" y2="215" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="255,215 248,205 245,215" fill="#fbbf24"/>
  
  <line x1="185" y1="145" x2="145" y2="105" stroke="#fbbf24" stroke-width="2"/>
  <polygon points="145,105 148,115 158,112" fill="#fbbf24"/>
  
  <!-- Element de surface dS -->
  <rect x="290" y="130" width="15" height="15" fill="none" stroke="#22c55e" stroke-width="2"/>
  <line x1="297" y1="137" x2="320" y2="115" stroke="#22c55e" stroke-width="2"/>
  <polygon points="320,115 310,118 313,128" fill="#22c55e"/>
  <text x="325" y="115" fill="#22c55e" font-size="10" font-family="Arial, sans-serif">dS⃗</text>
  
  <!-- Formule -->
  <text x="200" y="280" text-anchor="middle" fill="#a5b4fc" font-size="13" font-family="Arial, sans-serif">Φ = ∮ E⃗ · dS⃗ = Q_int / ε₀</text>
</svg>
