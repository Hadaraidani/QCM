<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Fond -->
  <rect width="400" height="300" fill="#1e293b"/>
  
  <!-- Titre -->
  <text x="200" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Champ magnétique d'un fil infini</text>
  
  <!-- Fil conducteur (vertical) -->
  <line x1="200" y1="50" x2="200" y2="260" stroke="#ef4444" stroke-width="6"/>
  
  <!-- Flèche de courant I -->
  <polygon points="200,70 193,85 207,85" fill="#fbbf24"/>
  <text x="220" y="75" fill="#fbbf24" font-size="14" font-family="Arial, sans-serif" font-weight="bold">I</text>
  
  <!-- Cercles de champ B (concentriques) -->
  <circle cx="200" cy="160" r="40" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="200" cy="160" r="70" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,3"/>
  
  <!-- Flèches tangentielles pour B -->
  <!-- Cercle intérieur -->
  <polygon points="240,160 235,153 232,163" fill="#60a5fa"/>
  <polygon points="160,160 165,167 168,157" fill="#60a5fa"/>
  <polygon points="200,120 193,125 203,128" fill="#60a5fa"/>
  <polygon points="200,200 207,195 197,192" fill="#60a5fa"/>
  
  <!-- Cercle extérieur -->
  <polygon points="270,160 265,153 262,163" fill="#60a5fa"/>
  <polygon points="130,160 135,167 138,157" fill="#60a5fa"/>
  
  <!-- Label B -->
  <text x="255" y="130" fill="#60a5fa" font-size="14" font-family="Arial, sans-serif" font-weight="bold">B⃗</text>
  
  <!-- Distance r -->
  <line x1="200" y1="160" x2="270" y2="160" stroke="#22c55e" stroke-width="2"/>
  <circle cx="200" cy="160" r="3" fill="#22c55e"/>
  <text x="235" y="175" fill="#22c55e" font-size="12" font-family="Arial, sans-serif">r</text>
  
  <!-- Point P -->
  <circle cx="270" cy="160" r="5" fill="#22c55e"/>
  <text x="278" y="165" fill="#22c55e" font-size="11" font-family="Arial, sans-serif">P</text>
  
  <!-- Règle de la main droite -->
  <text x="330" y="90" fill="#a78bfa" font-size="10" font-family="Arial, sans-serif" text-anchor="middle">Règle de</text>
  <text x="330" y="105" fill="#a78bfa" font-size="10" font-family="Arial, sans-serif" text-anchor="middle">la main droite</text>
  
  <!-- Formule -->
  <text x="200" y="285" text-anchor="middle" fill="#a5b4fc" font-size="13" font-family="Arial, sans-serif">B = μ₀I / (2πr)</text>
</svg>
