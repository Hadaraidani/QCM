<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 280" width="450" height="280">
  <!-- Fond -->
  <rect width="450" height="280" fill="#1e293b"/>
  
  <!-- Titre -->
  <text x="225" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Circuit RLC Série - Résonance</text>
  
  <!-- Source de tension (générateur) -->
  <circle cx="60" cy="140" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
  <text x="60" y="145" text-anchor="middle" fill="#fbbf24" font-size="16" font-family="Arial, sans-serif">~</text>
  <text x="60" y="175" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="Arial, sans-serif">u(t)</text>
  
  <!-- Fils de connexion supérieurs -->
  <line x1="80" y1="140" x2="100" y2="140" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="100" y1="140" x2="100" y2="70" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="100" y1="70" x2="130" y2="70" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Résistance R -->
  <rect x="130" y="60" width="60" height="20" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="160" y="55" text-anchor="middle" fill="#ef4444" font-size="12" font-family="Arial, sans-serif">R</text>
  
  <!-- Fil entre R et L -->
  <line x1="190" y1="70" x2="220" y2="70" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Bobine L -->
  <path d="M220,70 Q230,55 240,70 Q250,85 260,70 Q270,55 280,70 Q290,85 300,70" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="260" y="55" text-anchor="middle" fill="#a78bfa" font-size="12" font-family="Arial, sans-serif">L</text>
  
  <!-- Fil entre L et C -->
  <line x1="300" y1="70" x2="340" y2="70" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Condensateur C -->
  <line x1="340" y1="55" x2="340" y2="85" stroke="#3b82f6" stroke-width="2"/>
  <line x1="355" y1="55" x2="355" y2="85" stroke="#3b82f6" stroke-width="2"/>
  <text x="347" y="50" text-anchor="middle" fill="#3b82f6" font-size="12" font-family="Arial, sans-serif">C</text>
  
  <!-- Fil de retour -->
  <line x1="355" y1="70" x2="390" y2="70" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="390" y1="70" x2="390" y2="210" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="390" y1="210" x2="100" y2="210" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="100" y1="210" x2="100" y2="140" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="40" y1="140" x2="100" y2="140" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Flèche de courant i(t) -->
  <line x1="110" y1="85" x2="125" y2="85" stroke="#22c55e" stroke-width="2"/>
  <polygon points="125,85 118,81 118,89" fill="#22c55e"/>
  <text x="117" y="100" fill="#22c55e" font-size="11" font-family="Arial, sans-serif">i(t)</text>
  
  <!-- Impédances -->
  <text x="160" y="95" text-anchor="middle" fill="#ef4444" font-size="10" font-family="Arial, sans-serif">Z_R = R</text>
  <text x="260" y="95" text-anchor="middle" fill="#a78bfa" font-size="10" font-family="Arial, sans-serif">Z_L = jLω</text>
  <text x="347" y="100" text-anchor="middle" fill="#3b82f6" font-size="10" font-family="Arial, sans-serif">Z_C = 1/jCω</text>
  
  <!-- Conditions de résonance -->
  <rect x="80" y="225" width="290" height="45" fill="#1e3a5f" rx="5"/>
  <text x="225" y="243" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="Arial, sans-serif" font-weight="bold">Résonance : Lω₀ = 1/(Cω₀)</text>
  <text x="225" y="260" text-anchor="middle" fill="#e2e8f0" font-size="10" font-family="Arial, sans-serif">ω₀ = 1/√(LC)  |  Z_min = R  |  I_max = U/R</text>
</svg>
