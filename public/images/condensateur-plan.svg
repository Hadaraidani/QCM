<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <!-- Fond -->
  <rect width="400" height="280" fill="#1e293b"/>
  
  <!-- Titre -->
  <text x="200" y="25" text-anchor="middle" fill="#e2e8f0" font-size="14" font-family="Arial, sans-serif" font-weight="bold">Condensateur Plan</text>
  
  <!-- Plaque positive (gauche) -->
  <rect x="100" y="60" width="8" height="140" fill="#ef4444"/>
  <text x="85" y="135" fill="#ef4444" font-size="20" font-family="Arial, sans-serif" font-weight="bold">+</text>
  
  <!-- Charges positives -->
  <text x="112" y="80" fill="#ef4444" font-size="12">+</text>
  <text x="112" y="100" fill="#ef4444" font-size="12">+</text>
  <text x="112" y="120" fill="#ef4444" font-size="12">+</text>
  <text x="112" y="140" fill="#ef4444" font-size="12">+</text>
  <text x="112" y="160" fill="#ef4444" font-size="12">+</text>
  <text x="112" y="180" fill="#ef4444" font-size="12">+</text>
  
  <!-- Plaque négative (droite) -->
  <rect x="292" y="60" width="8" height="140" fill="#3b82f6"/>
  <text x="305" y="135" fill="#3b82f6" font-size="20" font-family="Arial, sans-serif" font-weight="bold">−</text>
  
  <!-- Charges négatives -->
  <text x="280" y="80" fill="#3b82f6" font-size="12">−</text>
  <text x="280" y="100" fill="#3b82f6" font-size="12">−</text>
  <text x="280" y="120" fill="#3b82f6" font-size="12">−</text>
  <text x="280" y="140" fill="#3b82f6" font-size="12">−</text>
  <text x="280" y="160" fill="#3b82f6" font-size="12">−</text>
  <text x="280" y="180" fill="#3b82f6" font-size="12">−</text>
  
  <!-- Lignes de champ E -->
  <line x1="125" y1="90" x2="270" y2="90" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="270,90 260,86 260,94" fill="#fbbf24"/>
  
  <line x1="125" y1="130" x2="270" y2="130" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="270,130 260,126 260,134" fill="#fbbf24"/>
  
  <line x1="125" y1="170" x2="270" y2="170" stroke="#fbbf24" stroke-width="1.5"/>
  <polygon points="270,170 260,166 260,174" fill="#fbbf24"/>
  
  <text x="200" y="115" fill="#fbbf24" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">E⃗</text>
  
  <!-- Distance d -->
  <line x1="108" y1="210" x2="292" y2="210" stroke="#22c55e" stroke-width="2"/>
  <line x1="108" y1="205" x2="108" y2="215" stroke="#22c55e" stroke-width="2"/>
  <line x1="292" y1="205" x2="292" y2="215" stroke="#22c55e" stroke-width="2"/>
  <text x="200" y="228" fill="#22c55e" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">d</text>
  
  <!-- Surface S annotation -->
  <text x="60" y="205" fill="#a78bfa" font-size="12" font-family="Arial, sans-serif">S</text>
  <line x1="55" y1="70" x2="55" y2="190" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,2"/>
  <line x1="50" y1="70" x2="60" y2="70" stroke="#a78bfa" stroke-width="1"/>
  <line x1="50" y1="190" x2="60" y2="190" stroke="#a78bfa" stroke-width="1"/>
  
  <!-- Formules -->
  <text x="200" y="255" text-anchor="middle" fill="#a5b4fc" font-size="12" font-family="Arial, sans-serif">C = ε₀·S/d     |     E = σ/ε₀ = U/d</text>
</svg>
